# /etc/nginx/sites-available/sv14-lab-portal
# Reverse proxy on SV08 (192.168.2.108) → SV14 (192.168.2.114)
# Inbound from Cloudflare Tunnel only — TLS terminated at CF edge.

upstream sv14_frontend  { server 192.168.2.114:3000 max_fails=3 fail_timeout=10s; }
upstream sv14_backend   { server 192.168.2.114:8000 max_fails=3 fail_timeout=10s; }
# sv14_authentik upstream removed — federated SSO via id.bcse-vju.com (ADR-0014).
# sv14_wetty upstream removed in M5.7 — SSH ProxyJump replaces wetty.

server {
    listen 80;
    listen [::]:80;
    server_name sv14.bcse-vju.com;

    client_max_body_size 120m;     # 100 MB upload + headroom

    # Per-IP connection ceiling (DOS hardening)
    limit_conn sv14_conn 50;

    access_log /var/log/nginx/sv14-lab-portal.access.log;
    error_log  /var/log/nginx/sv14-lab-portal.error.log warn;

    # Forward standard real-IP / proto headers to all upstreams
    proxy_http_version 1.1;
    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   $scheme;
    proxy_set_header X-Forwarded-Host    $host;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # /auth/ location removed — federated SSO via id.bcse-vju.com (ADR-0014).
    # SSO endpoints now live under /api/auth/sso/ on the FastAPI backend.

    # /term/ location removed in M5.7 — wetty service decommissioned.
    # SSH access is now ProxyJump via TCP DNAT 2222 → SV14:22 on the
    # Proxmox host (separate from this nginx vhost).

    # FastAPI backend + SSE on /api/events/stream
    location ^~ /api/ {
        limit_req zone=sv14_api burst=50 nodelay;
        proxy_pass http://sv14_backend;
        proxy_buffering off;            # SSE / streaming
        proxy_cache off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        chunked_transfer_encoding on;
    }

    # OpenAPI raw
    location = /openapi.json {
        proxy_pass http://sv14_backend;
    }

    # Next.js frontend (default)
    location / {
        proxy_pass http://sv14_frontend;
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }
}
