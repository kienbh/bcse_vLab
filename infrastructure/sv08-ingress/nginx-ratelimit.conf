# /etc/nginx/conf.d/sv14-ratelimit.conf
# Rate-limit zones for sv14.bcse-vju.com — install once on SV08.

# Per-IP general API: 500 req/min (burst 100 — set on the location directive
# in nginx-sv14-vhost.conf). Bumped from 100r/m on 2026-05-30 because the
# `/devices/vps` dashboard polls live-status on 16 VPS cards every 8s ≈
# 120 req/min — chamber the old limit on a single page load.
limit_req_zone $binary_remote_addr zone=sv14_api:10m rate=500r/m;

# Per-IP auth/login: 10 req/min (burst 5) — protects Authentik login
limit_req_zone $binary_remote_addr zone=sv14_auth:10m rate=10r/m;

# Per-IP terminal/wetty: 30 req/min (WS handshakes)
limit_req_zone $binary_remote_addr zone=sv14_term:10m rate=30r/m;

# Connection limit per IP
limit_conn_zone $binary_remote_addr zone=sv14_conn:10m;

# Custom response when limit hit
limit_req_status 429;
limit_conn_status 429;
