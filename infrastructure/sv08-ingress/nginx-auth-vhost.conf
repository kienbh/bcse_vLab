# /etc/nginx/sites-available/auth-sv14
# Reverse proxy on SV08 → SV14:9000 (Authentik). Subdomain pattern.
# TLS at Cloudflare edge; SV08 → SV14 plain HTTP over LAN.

server {
    listen 80;
    listen [::]:80;
    server_name lab-auth.bcse-vju.com;

    client_max_body_size 16m;
    limit_conn sv14_conn 30;

    access_log /var/log/nginx/auth-sv14.access.log;
    error_log  /var/log/nginx/auth-sv14.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   https;     # CF terminates TLS
    proxy_set_header X-Forwarded-Host    $host;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    location / {
        limit_req zone=sv14_auth burst=10 nodelay;
        proxy_pass http://192.168.2.114:9000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering off;
    }
}
