# Production stack on SV14 (192.168.2.114, 4 GB RAM).
# Local-password auth (no Authentik) — pre-seeded whitelist.
# Gateway: ADR-0013 (M5.8) — PVE host as `ssh -J vlab@...` jump.
#
# Memory budget (3.8 GB available, leave ~600 MB for host):
#   postgres   512M (app DB)
#   redis      128M (LRU 96M)
#   backend    512M
#   worker     384M
#   frontend   512M
#   mock-kit    96M (only when `docker compose --profile mock up`)
#   ────────── ────
#   total      ~2.1 GB committed

name: vju-lab-portal

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    mem_swappiness: 10
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 64m
    mem_swappiness: 10
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - internal

  backend:
    image: ${BACKEND_IMAGE:-vju-lab-portal-backend:latest}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    mem_swappiness: 10
    # host-gateway lets the container reach the SV14 host's own sshd
    # (needed for the M5.7 jump-user create/delete via SSH ProxyJump).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.prod
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ALLOWED_ORIGINS: '["https://${PUBLIC_HOSTNAME}"]'
    volumes:
      - backend_uploads:/app/uploads
      - backend_ssh_keys:/app/ssh-keys
    networks:
      - internal
      - lan
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: ${BACKEND_IMAGE:-vju-lab-portal-backend:latest}
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 192m
    mem_swappiness: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["rq", "worker", "--with-scheduler", "--url", "redis://:${REDIS_PASSWORD}@redis:6379/0", "default"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file:
      - .env.prod
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - backend_uploads:/app/uploads
      - backend_ssh_keys:/app/ssh-keys
    networks:
      - internal
      - lan
    depends_on:
      backend:
        condition: service_started

  frontend:
    image: ${FRONTEND_IMAGE:-vju-lab-portal-frontend:latest}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    mem_swappiness: 10
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${PUBLIC_HOSTNAME}/api
      NEXT_PUBLIC_DOMAIN: ${PUBLIC_HOSTNAME}
    networks:
      - internal
      - lan
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      backend:
        condition: service_started

  # M5.7 wetty service removed. ADR-0013 (M5.8): users SSH with a per-booking
  # password through the PVE jump host (`vlab` user, PAM → backend). See
  # infrastructure/pve/setup-jump-host-pve.sh.

  # Mock kit — Alpine + sshd, plays the role of an FPGA when MOCK_SSH_DEVICES=true
  # and there's no real tunnel to Hoà Lạc. Backend's resolve-target returns this
  # container's IP, ForceCommand SSHes here with the backend admin key.
  mock-kit:
    image: linuxserver/openssh-server:latest
    profiles: ["mock"]
    restart: unless-stopped
    mem_limit: 96m
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Ho_Chi_Minh
      USER_NAME: pi
      # Pre-installed pubkey of the backend admin — mounted from a host file
      # generated by `make mock-kit-key` (gens a fresh ed25519 if missing).
      PUBLIC_KEY_FILE: /run/secrets/backend_pubkey
      SUDO_ACCESS: "false"
      PASSWORD_ACCESS: "false"
    secrets:
      - backend_pubkey
    networks:
      - lan
    # Expose port 22 only inside the `lan` docker network — never to the
    # outside. The jump host SSHes here via the backend container as a hop.

networks:
  internal:
    driver: bridge
    internal: true
  lan:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_ssh_keys:

secrets:
  backend_pubkey:
    file: ./secrets/backend_admin.pub
